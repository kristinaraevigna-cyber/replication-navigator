# Render Blueprint: New → Blueprint → select this repo.
# Creates the web app. Research logs need a Postgres database: add one before the summit
# and paste its connection string into DATABASE_URL (see docs/DEPLOY.md).
# Without it, logs go to a local file that Render wipes on every restart (fine for testing).
services:
  - type: web
    name: replication-navigator
    runtime: node
    plan: free            # switch to a paid always-on plan for the summit day to avoid ~1 min cold starts
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false       # you will be asked for it when the Blueprint is created
      - key: ACCESS_CODE
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: ALLOW_BYO_KEY
        value: "true"
      - key: RATE_PER_HOUR
        value: "60"
      - key: DATABASE_URL
        sync: false       # optional: paste a Postgres connection string before the summit (see docs/DEPLOY.md)
